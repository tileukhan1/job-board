<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Board — Python Django</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 24px 16px;
    }
    header {
      max-width: 1200px;
      margin: 0 auto 24px;
    }
    header h1 { font-size: 1.6rem; font-weight: 700; }
    header p { color: #666; margin-top: 4px; font-size: .9rem; }
    .stats {
      display: flex;
      gap: 16px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .stat {
      background: #fff;
      border-radius: 8px;
      padding: 12px 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .stat strong { font-size: 1.4rem; display: block; }
    .stat span { font-size: .8rem; color: #888; }
    .controls {
      max-width: 1200px;
      margin: 0 auto 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .controls input {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: .9rem;
      flex: 1;
      min-width: 200px;
    }
    .controls select {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: .9rem;
      background: #fff;
    }
    .table-wrap {
      max-width: 1200px;
      margin: 0 auto;
      overflow-x: auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 6px rgba(0,0,0,.08);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .88rem;
    }
    th {
      background: #f0f0f0;
      padding: 10px 12px;
      text-align: left;
      font-weight: 600;
      white-space: nowrap;
      position: sticky;
      top: 0;
    }
    td {
      padding: 10px 12px;
      border-top: 1px solid #eee;
      vertical-align: top;
    }
    tr:hover td { background: #fafafa; }
    tr.closed td { color: #aaa; }
    tr.closed a { color: #aaa; }
    td a { color: #0073b1; text-decoration: none; word-break: break-word; }
    td a:hover { text-decoration: underline; }
    .badge {
      display: inline-block;
      color: #fff;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: .75rem;
      font-weight: 600;
      white-space: nowrap;
    }
    footer {
      max-width: 1200px;
      margin: 24px auto 0;
      font-size: .8rem;
      color: #aaa;
      text-align: center;
    }
    @media (max-width: 600px) {
      th:nth-child(4), td:nth-child(4),
      th:nth-child(5), td:nth-child(5),
      th:nth-child(9), td:nth-child(9) { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🔍 Job Board — Python Django / IT Railways</h1>
    <p>Обновлено: 2026-06-05 11:03</p>
    <div class="stats">
      <div class="stat"><strong>0</strong><span>всего</span></div>
      <div class="stat"><strong>0</strong><span>активных</span></div>
      <div class="stat"><strong>0</strong><span>закрытых</span></div>
    </div>
  </header>

  <div class="controls">
    <input id="search" type="search" placeholder="Поиск по названию, компании…" oninput="filterTable()">
    <select id="statusFilter" onchange="filterTable()">
      <option value="">Все статусы</option>
      <option value="active">✅ Активные</option>
      <option value="closed">❌ Закрытые</option>
    </select>
    <select id="sourceFilter" onchange="filterTable()">
      <option value="">Все источники</option>
      <option value="hh">hh.kz</option>
      <option value="railways">job.railways.kz</option>
    </select>
  </div>

  <div class="table-wrap">
    <table id="vacTable">
      <thead>
        <tr>
          <th></th>
          <th>Источник</th>
          <th>Вакансия</th>
          <th>Компания</th>
          <th>Город</th>
          <th>Зарплата</th>
          <th>Найдена</th>
          <th>Закрыта</th>
        </tr>
      </thead>
      <tbody id="tbody">
        
      </tbody>
    </table>
  </div>

  <footer>Автоматически обновляется ежедневно в 10:00 · <a href="https://github.com">GitHub</a></footer>

  <script>
    function filterTable() {
      const q = document.getElementById('search').value.toLowerCase();
      const st = document.getElementById('statusFilter').value;
      const src = document.getElementById('sourceFilter').value;
      document.querySelectorAll('#tbody tr').forEach(row => {
        const text = row.textContent.toLowerCase();
        const isClosed = row.classList.contains('closed');
        const statusOk = !st || (st === 'closed' ? isClosed : !isClosed);
        const srcOk = !src || row.dataset.source === src;
        row.style.display = text.includes(q) && statusOk && srcOk ? '' : 'none';
      });
    }
  </script>
</body>
</html>
